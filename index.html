<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영등포소방서 현장대응 통합 현황판</title>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --fire-color: #ef4444;
            --accident-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        .container { width: 100%; max-width: 440px; }

        .glass-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(226, 232, 240, 0.8);
            text-align: center;
        }

        .header-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
        .header-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; font-weight: 500; }

        .input-group { margin-bottom: 14px; text-align: left; }
        .input-label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border-radius: 14px;
            border: 1.5px solid #cbd5e1;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
        }
        .input-field:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        .btn-primary {
            width: 100%;
            height: 50px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .switch-link { margin-top: 16px; font-size: 13px; color: var(--text-sub); }
        .switch-link span { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: underline; margin-left: 4px; }

        .user-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .logout-btn { background: none; border: none; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; }
        .logout-btn:hover { color: #ef4444; }

        .menu-grid { display: flex; flex-direction: column; gap: 16px; }
        .board-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 22px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: left;
        }
        .board-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .board-card.fire:hover { border-color: var(--fire-color); }
        .board-card.accident:hover { border-color: var(--accident-color); }

        .card-icon { font-size: 36px; margin-right: 18px; }
        .card-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .card-info p { font-size: 13px; color: var(--text-sub); }

        /* 관리자 승인 관리 구역 */
        .admin-panel {
            margin-top: 24px;
            padding: 16px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 18px;
            text-align: left;
        }
        .admin-title { font-size: 14px; font-weight: 800; color: #b45309; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .pending-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .pending-item {
            background: #ffffff;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #fed7aa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .approve-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .hidden { display: none !important; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; font-weight: 600; line-height: 1.4; }
        .info-msg { color: #0284c7; font-size: 13px; margin-top: 10px; font-weight: 600; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 로그인 폼 -->
    <div id="loginSection" class="glass-card">
        <div style="font-size: 40px; margin-bottom: 10px;">🚒</div>
        <h1 class="header-title">영등포소방서 현장대응</h1>
        <p class="header-sub">통합 현황판 로그인</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label class="input-label">아이디 (이메일)</label>
                <input type="email" id="loginEmail" class="input-field" placeholder="example@fire.go.kr" required>
            </div>
            <div class="input-group">
                <label class="input-label">비밀번호</label>
                <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">로그인</button>
            <div id="loginError" class="error-msg hidden"></div>
            <div id="loginInfo" class="info-msg hidden"></div>
        </form>

        <div class="switch-link">
            계정이 없으신가요?<span onclick="toggleAuth('signup')">대원 회원가입</span>
        </div>
        <div class="switch-link" style="margin-top: 8px;">
            비밀번호를 잊으셨나요?<span onclick="handleResetPassword()">비밀번호 찾기</span>
        </div>
    </div>

    <!-- 2. 회원가입 폼 -->
    <div id="signupSection" class="glass-card hidden">
        <h1 class="header-title">대원 신규 등록</h1>
        <p class="header-sub">관리자 승인 후 현황판 이용이 가능합니다</p>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="input-group">
                <label class="input-label">성명</label>
                <input type="text" id="regName" class="input-field" placeholder="예: 백기태" required>
            </div>
            <div class="input-group">
                <label class="input-label">소속 (센터/팀)</label>
                <input type="text" id="regTeam" class="input-field" placeholder="예: 현장대응단 1팀" required>
            </div>
            <div class="input-group">
                <label class="input-label">아이디 (이메일)</label>
                <input type="email" id="regEmail" class="input-field" placeholder="example@fire.go.kr" required>
                <!-- 👇 실제 메일 안내 문구 추가 -->
                <div style="font-size:11px; color:#64748b; margin-top:6px; line-height:1.3;">
                    ※ 비밀번호 분실 시 재설정 메일이 발송되므로, 실제 수신 가능한 이메일을 입력해 주세요.
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">비밀번호 (6자리 이상)</label>
                <input type="password" id="regPassword" class="input-field" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" class="btn-primary">가입 신청</button>
            <div id="signupError" class="error-msg hidden"></div>
        </form>

        <div class="switch-link">
            이미 계정이 있으신가요?<span onclick="toggleAuth('login')">로그인으로 돌아가기</span>
        </div>
    </div>

    <!-- 3. 메인 현황판 허브 (로그인 & 승인 완료 시 노출) -->
    <div id="hubSection" class="glass-card hidden">
        <div class="user-status">
            <span>🚨 <b id="displayUserName">대원</b>님 (<span id="displayUserTeam" style="color: #64748b; font-weight: normal;">소속</span>)</span>
            <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>

        <h1 class="header-title" style="margin-bottom: 20px;">현황판 선택</h1>

        <div class="menu-grid">
            <div class="board-card fire" onclick="location.href='fire.html'">
                <div class="card-icon">🏢</div>
                <div class="card-info">
                    <h3>공동주택 화재 현황판</h3>
                    <p>세대별 대피 및 구조 현황</p>
                </div>
            </div>

            <div class="board-card accident" onclick="location.href='accident.html'">
                <div class="card-icon">🚗</div>
                <div class="card-info">
                    <h3>교통사고 현황판</h3>
                    <p>사고 발생 및 부상자 현황</p>
                </div>
            </div>
        </div>

        <!-- 4. 관리자 전용 대원 승인 패널 (관리자 접속 시에만 노출) -->
        <div id="adminPanel" class="admin-panel hidden">
            <div class="admin-title">
                <span>🛡️ 가입 승인 대기 대원</span>
                <span id="pendingCount">0명</span>
            </div>
            <ul id="pendingList" class="pending-list">
                <!-- 승인 대기 목록이 여기에 동적으로 추가됩니다 -->
            </ul>
        </div>
    </div>
</div>

<script>
    // 🔥 실제 Firebase 연동 키
    const firebaseConfig = {
        apiKey: "AIzaSyBaGmIgVoIzrQ1WRdn8BwrO0fPOECNl-mQ",
        authDomain: "apartment-fire-board-bydy.firebaseapp.com",
        databaseURL: "https://apartment-fire-board-bydy-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "apartment-fire-board-bydy",
        storageBucket: "apartment-fire-board-bydy.firebasestorage.app",
        messagingSenderId: "389632256658",
        appId: "1:389632256658:web:3add30eae087876437d44b"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    // 💡 관리자 계정 판별 (가입 승인 권한을 가질 이메일들)
    // 원하시는 관리자 이메일을 따옴표 안에 넣어주세요. (여러 개 가능)
    const ADMIN_EMAILS = ["youngbal3@seoul.go.kr"];

    // 인증 상태 감시
    auth.onAuthStateChanged((user) => {
        if (user) {
            // 유저 DB 정보 확인
            db.ref('users/' + user.uid).once('value').then((snapshot) => {
                const userData = snapshot.val();
                
                // 💡 [무적 코드] 대소문자나 공백이 섞여도 무조건 관리자로 정확히 인식
                const currentUserEmail = user.email ? user.email.trim().toLowerCase() : "";
                const isAdmin = ADMIN_EMAILS.some(email => email.trim().toLowerCase() === currentUserEmail);

                // 💡 과거 가입자(approved)와 신규 가입자(status) 방식 모두 호환
                const isApproved = isAdmin || (userData && (userData.status === 'approved' || userData.approved === true || userData.role === 'admin'));

                if (!isApproved) {
                    // 미승인 대원인 경우 즉시 강제 로그아웃
                    auth.signOut();
                    showSection('login');
                    const errEl = document.getElementById('loginError');
                    errEl.innerText = "⏳ 관리자 승인 대기 중인 계정입니다.\n관리자 승인 완료 후 이용 가능합니다.";
                    errEl.classList.remove('hidden');
                    return;
                }

                // 정상 승인 대원 또는 관리자
                const userName = userData ? userData.name : user.email.split('@')[0];
                const userTeam = userData ? userData.team : '대응단';
                
                document.getElementById('displayUserName').innerText = userName;
                document.getElementById('displayUserTeam').innerText = userTeam;
                
                // 서브 보드에서 쓸 수 있도록 세션 스토리지에 이름 저장
                sessionStorage.setItem('current_user_name', userName);
                sessionStorage.setItem('current_user_team', userTeam);

                showSection('hub');

                // 관리자인 경우 승인 관리 패널 로드
                if (isAdmin) {
                    loadPendingUsers();
                }
            });
        } else {
            showSection('login');
        }
    });

    function showSection(section) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('signupSection').classList.add('hidden');
        document.getElementById('hubSection').classList.add('hidden');

        if (section === 'login') document.getElementById('loginSection').classList.remove('hidden');
        if (section === 'signup') document.getElementById('signupSection').classList.remove('hidden');
        if (section === 'hub') document.getElementById('hubSection').classList.remove('hidden');
    }

    function toggleAuth(type) {
        document.getElementById('loginError').classList.add('hidden');
        document.getElementById('loginInfo').classList.add('hidden');
        document.getElementById('signupError').classList.add('hidden');
        showSection(type);
    }

    // 로그인
    function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value;
        const errEl = document.getElementById('loginError');
        const infoEl = document.getElementById('loginInfo');
        errEl.classList.add('hidden');
        infoEl.classList.add('hidden');

        auth.signInWithEmailAndPassword(email, pass).catch((err) => {
            errEl.innerText = "로그인 실패: 아이디 또는 비밀번호를 확인해주세요.";
            errEl.classList.remove('hidden');
        });
    }

    // 회원가입 신청
    function handleSignup(e) {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const team = document.getElementById('regTeam').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const pass = document.getElementById('regPassword').value;
        const errEl = document.getElementById('signupError');
        errEl.classList.add('hidden');

        // 관리자 이메일 목록에 있으면 처음부터 자동 승인, 일반 대원은 pending(대기)
        const initialStatus = ADMIN_EMAILS.includes(email) ? 'approved' : 'pending';

        auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
            // DB에 정보 저장
            return db.ref('users/' + cred.user.uid).set({
                name: name,
                team: team,
                email: email,
                status: initialStatus,
                createdAt: new Date().toISOString()
            }).then(() => {
                if (initialStatus === 'pending') {
                    // 가입 즉시 자동 로그인된 세션을 바로 끊어줌 (핵심!)
                    auth.signOut().then(() => {
                        showSection('login');
                        const infoEl = document.getElementById('loginInfo');
                        infoEl.innerText = "✅ 가입 신청이 완료되었습니다.\n관리자 승인 후 로그인할 수 있습니다.";
                        infoEl.classList.remove('hidden');
                        document.getElementById('signupForm').reset();
                    });
                }
            });
        }).catch((err) => {
            errEl.innerText = "가입 신청 실패: " + err.message;
            errEl.classList.remove('hidden');
        });
    }

    // 관리자: 대기 목록 불러오기 & 실시간 감시
    function loadPendingUsers() {
        const adminPanel = document.getElementById('adminPanel');
        adminPanel.classList.remove('hidden');

        db.ref('users').on('value', (snapshot) => {
            const listEl = document.getElementById('pendingList');
            listEl.innerHTML = '';
            let count = 0;

            snapshot.forEach((child) => {
                const u = child.val();
                const uid = child.key;

                if (u.status === 'pending' || u.approved === false) {
                    count++;
                    const li = document.createElement('li');
                    li.className = 'pending-item';
                    li.innerHTML = `
                        <div>
                            <b>${u.name}</b> (${u.team})<br>
                            <span style="font-size: 11px; color: #64748b;">${u.email}</span>
                        </div>
                        <button class="approve-btn" onclick="approveUser('${uid}')">승인</button>
                    `;
                    listEl.appendChild(li);
                }
            });

            document.getElementById('pendingCount').innerText = count + '명';
            if (count === 0) {
                listEl.innerHTML = '<li style="font-size:12px; color:#94a3b8; text-align:center; padding:8px;">대기 중인 대원이 없습니다.</li>';
            }
        });
    }

    // 관리자: 원클릭 승인 실행
    window.approveUser = function(uid) {
        if (confirm('이 대원의 접속을 승인하시겠습니까?')) {
            db.ref('users/' + uid).update({
                status: 'approved',
                approved: true
            }).then(() => {
                alert('승인 완료되었습니다.');
            });
        }
    };

    // 로그아웃
    function handleLogout() {
        auth.signOut();
        sessionStorage.clear();
    }
    // 💡 비밀번호 찾기 (재설정 메일 자동 발송)
    window.handleResetPassword = function() {
        const currentInputEmail = document.getElementById('loginEmail') ? document.getElementById('loginEmail').value.trim() : '';
        const email = prompt("비밀번호를 재설정할 이메일 아이디를 입력해주세요:", currentInputEmail);

        if (email === null) return; // 취소 누른 경우
        if (!email.trim()) {
            alert("이메일 주소를 입력해주세요.");
            return;
        }

        auth.sendPasswordResetEmail(email.trim())
            .then(() => {
                alert(`✅ 비밀번호 재설정 메일이 발송되었습니다!\n[${email.trim()}] 메일함을 확인하여 비밀번호를 변경해 주세요.`);
            })
            .catch(error => {
                if (error.code === 'auth/user-not-found') {
                    alert("등록되지 않은 이메일 주소입니다.");
                } else if (error.code === 'auth/invalid-email') {
                    alert("올바른 이메일 형식을 입력해주세요. (예: ydp01@seoul.go.kr)");
                } else {
                    alert("메일 발송 실패: " + error.message);
                }
            });
    };
</script>
</body>
</html>
